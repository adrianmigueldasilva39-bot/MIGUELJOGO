name: Compilar PKG PS3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3dev:latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Compilar ELF, SELF e PKG
        run: |
          make clean
          make
          make pkg
          ls -lh

      - name: Enviar artefatos (PKG e ELF)
        uses: actions/upload-artifact@v4
        with:
          name: cobra-ps3
          path: |
            cobra.pkg
            cobra.self
            cobra.elf
          if-no-files-found: error
