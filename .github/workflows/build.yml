name: Build PS3 PKG
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git make python3 wget tar bzip2 gcc g++ pkg-config libgmp-dev libmpfr-dev libmpc-dev texinfo flex bison autoconf automake libtool zlib1g-dev libncurses-dev

      - name: Instalar PSL1GHT
        run: |
          export PS3DEV=/opt/ps3dev
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          echo "PS3DEV=/opt/ps3dev" >> $GITHUB_ENV
          echo "PATH=$PATH:/opt/ps3dev/bin:/opt/ps3dev/ppu/bin:/opt/ps3dev/spu/bin" >> $GITHUB_ENV
          sudo mkdir -p /opt/ps3dev
          sudo chown -R $USER /opt/ps3dev
          git clone https://github.com/ps3dev/psl1ght.git /tmp/psl1ght
          cd /tmp/psl1ght
          ./build.sh || true
          ls /opt/ps3dev/bin/ || echo "tentando metodo 2"
          git clone https://github.com/ps3dev/ps3toolchain.git /tmp/ps3toolchain
          cd /tmp/ps3toolchain
          ./toolchain.sh || true

      - name: Build EBOOT
        run: |
          export PS3DEV=/opt/ps3dev
          export PATH=$PATH:/opt/ps3dev/bin:/opt/ps3dev/ppu/bin:/opt/ps3dev/spu/bin
          make clean || true
          make

      - name: Make PKG
        run: |
          mkdir -p pkg/USRDIR
          cp slither.self pkg/USRDIR/EBOOT.BIN
          cp ICON0.PNG pkg/ICON0.PNG || echo "sem icone"
          python3 make_sfo.py
          cp PARAM.SFO pkg/PARAM.SFO
          ls -R pkg

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: SLITHERIO-pkg
          path: pkg/