name: Compilar PKG PS3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: hldtux/ps3dev:latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Procurar ferramentas
        run: |
          echo "--- conteudo de bin ---"
          ls /usr/local/ps3dev/bin || true
          echo "--- procura por sfo/pkg/self/sprx ---"
          find / \( -name "sfo.py" -o -name "pkg.py" -o -name "make_self_npdrm" -o -name "sprxlinker" \) 2>/dev/null || true

      - name: Compilar PKG
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          make clean
          make
          ls -lh

      - name: Enviar artefatos (PKG e ELF)
        uses: actions/upload-artifact@v4
        with:
          name: cobra-ps3
          path: |
            cobra.pkg
            cobra.elf
          if-no-files-found: error