name: Compilar PKG / build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps3dev/psl1ght:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          export PS3DEV=/opt/ps3dev
          export PSL1GHT=/opt/ps3dev
          export PATH=$PS3DEV/ppu/bin:$PATH
          make
          make pkg || true
          ls -lh

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: cobra-ps3
          path: |
            cobra.elf
            cobra.pkg
            cobra.self
          if-no-files-found: warn