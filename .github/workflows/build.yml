name: Build PS3 PKG
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3toolchain:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ver toolchain
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PATH=$PATH:/usr/local/ps3dev/bin:/usr/local/ps3dev/ppu/bin:/usr/local/ps3dev/spu/bin
          which psl1ght-config
          psl1ght-config --prefix
          ls /usr/local/ps3dev/

      - name: Build EBOOT
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PATH=$PATH:/usr/local/ps3dev/bin:/usr/local/ps3dev/ppu/bin:/usr/local/ps3dev/spu/bin
          make clean || true
          make

      - name: Make PKG
        run: |
          mkdir -p pkg/USRDIR
          cp slither.self pkg/USRDIR/EBOOT.BIN
          cp ICON0.PNG pkg/ICON0.PNG || echo "sem icone"
          python3 make_sfo.py
          cp PARAM.SFO pkg/PARAM.SFO
          ls -R pkg

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: SLITHERIO-pkg
          path: pkg/