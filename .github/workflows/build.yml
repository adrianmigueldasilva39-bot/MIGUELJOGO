# .github/workflows/build.yml
name: Compilar PKG / build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PS3DEV: /home/runner/ps3dev
      PSL1GHT: /home/runner/ps3dev
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl autoconf automake libtool libtool-bin pkg-config texinfo bison flex libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev libncurses-dev libelf-dev libelf1 python3 unzip

      - name: Cache PSL1GHT
        uses: actions/cache@v4
        id: cache-ps3
        with:
          path: ~/ps3dev
          key: ps3dev-psl1ght-v2

      - name: Instalar PSL1GHT
        if: steps.cache-ps3.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/ps3dev/bin
          echo "PS3DEV=$HOME/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=$HOME/ps3dev" >> $GITHUB_ENV
          echo "$HOME/ps3dev/bin" >> $GITHUB_PATH
          echo "$HOME/ps3dev/ppu/bin" >> $GITHUB_PATH
          export PS3DEV=$HOME/ps3dev
          export PSL1GHT=$HOME/ps3dev
          export PATH=$HOME/ps3dev/bin:$HOME/ps3dev/ppu/bin:$PATH
          git clone --depth 1 https://github.com/ps3dev/ps3toolchain.git /tmp/ps3toolchain
          cd /tmp/ps3toolchain
          ./toolchain.sh

      - name: Build
        run: |
          export PS3DEV=$HOME/ps3dev
          export PSL1GHT=$HOME/ps3dev
          export PATH=$HOME/ps3dev/bin:$HOME/ps3dev/ppu/bin:$PATH
          ls $PS3DEV/ppu/bin/ppu-gcc
          make clean || true
          make
          make pkg || true
          ls -lh

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: cobra-ps3
          path: |
            cobra.elf
            cobra.pkg
            cobra.self
            PARAM.SFO
          if-no-files-found: warn